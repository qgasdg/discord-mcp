[project]
name = "discord-mcp"
version = "0.1.0"
description = "On-demand Discord MCP server: read channels and post messages with no gateway connection. Works alongside the Claude Code Discord channel plugin."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.2.0,<2",
  "httpx>=0.27",
]
keywords = ["mcp", "discord", "claude", "claude-code", "model-context-protocol"]

[project.scripts]
discord-mcp = "discord_mcp:main"

[project.urls]
Repository = "https://github.com/qgasdg/discord-mcp"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["discord_mcp.py"]
